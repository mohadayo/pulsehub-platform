version: "3.8"

services:
  gateway:
    build: ./services/gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GATEWAY_PORT=8080
      - COLLECTOR_URL=http://collector:8081
      - ANALYTICS_URL=http://analytics:8082
    depends_on:
      collector:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  collector:
    build: ./services/collector
    ports:
      - "${COLLECTOR_PORT:-8081}:8081"
    environment:
      - COLLECTOR_PORT=8081
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  analytics:
    build: ./services/analytics
    ports:
      - "${ANALYTICS_PORT:-8082}:8082"
    environment:
      - ANALYTICS_PORT=8082
      - COLLECTOR_URL=http://collector:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
